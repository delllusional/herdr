id = "dontspeak.voice"
name = "Don't Speak Voice"
version = "0.1.0"
min_herdr_version = "0.6.10"
description = "Voice queue badges and a terminal-native dictation preview for Herdr panes."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "scripts/status_bridge.py"]

[[actions]]
id = "dictate"
title = "Dictate to this pane"
description = "Open the live Don't Speak transcription panel for the selected agent."
contexts = ["pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "dontspeak.voice", "--entrypoint", "dictation", "--placement", "overlay", "--focus"]

[[panes]]
id = "dictation"
title = "Don't Speak Dictation"
placement = "overlay"
command = ["python3", "scripts/dictation.py"]
